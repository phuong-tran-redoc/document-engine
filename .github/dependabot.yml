version: 2
updates:
  # npm dependencies — weekly, with a cooldown so brand-new releases aren't pulled immediately
  # (cheapest defense against the npm supply-chain worm class; see .context/ops/security-legal-gate.md).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # Framework-spine majors are adopted only during a planned migration, never via an
    # unsolicited Dependabot PR. Patch/minor still flow (and stay on the manual track for these).
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zone.js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'rxjs'
        update-types: ['version-update:semver-major']
      # ng-packagr and angular-eslint are the same spine by another name: both v22 hard-require
      # Angular 22 + TypeScript 6 ("TypeScript versions older than 6.0 are no longer supported"),
      # so a PR for either is really an Angular-major migration wearing a dev-dependency label.
      # ng-packagr additionally decides the .d.ts format the published lib emits, which is what
      # sets the >=16 Angular peer floor (ADR-006 / DE-013) — moving it silently moves a
      # published contract. PRs #38 and #40 were both red on arrival for exactly this reason.
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      # Dependabot can only ever bump `nx` on its own, never the ten `@nx/*` plugins pinned
      # alongside it — so every major nx PR it opens is cohort-skewed by construction (nx core at
      # 23 against plugins at 22) and can never be merged as delivered. PR #39 was green and still
      # unmergeable. Majors here are a lock-step `pnpm up` done by hand; see the /dep-bump runbook.
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major']
    # Groups are matched top-down; a dep lands in the first group it matches. The split keeps
    # dev/build tooling (auto-merge eligible) cleanly separate from shipped/peer deps (manual),
    # so dependabot-auto-merge.yml sees an unambiguous dependency-type per grouped PR.
    groups:
      # Shipped/peer spine — kept on the manual-review track (see dependabot-auto-merge.yml).
      tiptap:
        patterns:
          - '@tiptap/*'
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
      nx:
        patterns:
          - '@nx/*'
          - 'nx'
      # Framework-spine build tools — dev-typed but workspace-wide blast radius (they build the
      # published .d.ts / fesm output). Isolated into their own group so they stay on the manual
      # track (enforced in dependabot-auto-merge.yml) without dragging the auto-eligible dev group.
      build-tooling:
        patterns:
          - '@swc/*'
          - 'ng-packagr'
      # Dev/build tooling (jest, eslint, prettier, playwright, @types/*, …) — never ships to
      # consumers, so minor+patch here is auto-merge eligible once CI is green.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Remaining production/peer deps that ship or are consumer-resolved (@floating-ui/dom,
      # lodash-es, …). Grouped but left for manual review on minor.
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # Keep pinned GitHub Actions SHAs current — all actions grouped into a single PR.
  # github-actions PRs never touch the published packages, so non-major auto-merges.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
