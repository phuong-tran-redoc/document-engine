name: security-gate

# Reusable pre-publish gate. Called by publish.yml as a required job, and runnable on PRs.
# Blocking steps fail the job; advisory steps use continue-on-error and report only.
# Spec + thresholds: .context/ops/security-legal-gate.md
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'libs/document-engine-core/**'
      - 'libs/document-engine-angular/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # --- BLOCKING: secrets in git history ---
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      # Deterministic install with NO dependency lifecycle scripts.
      - name: Install (frozen, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # --- BLOCKING: angular peer-floor guard, layer 1 (static) ---
      # Fail if the angular lib uses Angular APIs newer than its declared peer floor
      # (>=16): signals, signal inputs, control flow, decorator-option inputs, etc.
      - name: Angular peer-floor guard (static denylist)
        run: node tools/check-angular-floor.mjs

      - name: Build publishable libs
        run: pnpm nx run-many -t build --projects=tag:scope:public

      # Scope the OSV scan to the PUBLISHED production closure (not the ~2014-pkg dev lockfile).
      # For each built package we synthesize a manifest containing only its real runtime
      # `dependencies` — dev + peer deps and the workspace self-ref are dropped (peers/core are
      # consumer- or sibling-provided), then resolve a production lockfile from the registry.
      # core's deps are the bundled @tiptap/* + tslib closure; angular adds @floating-ui/dom + tslib.
      - name: Prepare published prod closure for OSV
        run: |
          set -eux
          for pkg in document-engine-core document-engine-angular; do
            mkdir -p "osv-scan/$pkg"
            node -e "const p=require('./dist/libs/$pkg/package.json');delete p.devDependencies;delete p.peerDependencies;if(p.dependencies)delete p.dependencies['@phuong-tran-redoc/document-engine-core'];require('fs').writeFileSync('osv-scan/$pkg/package.json',JSON.stringify(p,null,2))"
            (cd "osv-scan/$pkg" && npm install --package-lock-only --omit=dev --omit=peer --ignore-scripts)
            # Guard: a real closure resolves >1 package (root + deps). An empty lockfile would let
            # the blocking OSV scan below pass while scanning nothing — fail loudly instead.
            node -e "const n=Object.keys(require('./osv-scan/$pkg/package-lock.json').packages||{}).length; if(n<=1){console.error('OSV prep: '+'$pkg'+' resolved '+n+' packages — empty closure, refusing to scan nothing'); process.exit(1)} else {console.log('$pkg closure: '+n+' packages')}"
          done

      # --- BLOCKING (DE-010 #3): scoped to the published prod closure above. A vuln in the SHIPPED
      # surface (core's @tiptap/* + tslib closure; angular's @floating-ui/dom + tslib) fails the gate.
      # Confirmed green on PR #26: osv-scanner scanned 57 + 4 packages, "No issues found", exit 0.
      # The full-lockfile dev-tooling/peer noise that once forced this advisory does not apply here. ---
      - name: Dependency vulnerabilities (OSV-Scanner — published prod closure)
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=osv-scan/document-engine-core/package-lock.json
            --lockfile=osv-scan/document-engine-angular/package-lock.json

      # Generate THIRD-PARTY-NOTICES.txt into each dist (required in the tarball; see verify step).
      - name: Generate THIRD-PARTY-NOTICES
        run: |
          node tools/security/generate-third-party-notices.mjs dist/libs/document-engine-core
          node tools/security/generate-third-party-notices.mjs dist/libs/document-engine-angular

      # --- BLOCKING: public API surface (additive-only contract) ---
      # api-extractor regenerates the API report from the built .d.ts and fails if it drifts
      # from the committed etc/*.api.md. A REMOVED export = a breaking change (pre-1.0: minor
      # bump + a ### Migration changelog block); an added export = update the baseline.
      # Regenerate locally with: (cd libs/<pkg> && npx api-extractor run --local) then commit.
      - name: API surface check (api-extractor)
        run: |
          (cd libs/document-engine-core && npx api-extractor run --verbose)
          (cd libs/document-engine-angular && npx api-extractor run --verbose)

      # --- BLOCKING: transitive license allowlist (fail on GPL/AGPL/unknown) ---
      - name: License allowlist (production closure)
        run: |
          npx --yes license-checker-rseidelsohn \
            --start . \
            --production \
            --excludePrivatePackages \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0' \
            --excludePackages '@phuong-tran-redoc/document-engine-core;@phuong-tran-redoc/document-engine-angular'

      # --- BLOCKING: tarball contents (no secrets/junk; LICENSE present) ---
      - name: Verify tarball contents
        run: |
          node tools/security/verify-tarball.mjs dist/libs/document-engine-core
          node tools/security/verify-tarball.mjs dist/libs/document-engine-angular

      # --- BLOCKING: package wiring + type resolution (ESM core / ESM angular) ---
      - name: publint + are-the-types-wrong
        run: |
          npx --yes publint --strict --pack npm dist/libs/document-engine-core
          npx --yes publint --strict --pack npm dist/libs/document-engine-angular
          # core ships swc-built ESM whose .d.ts barrels use extensionless re-exports.
          # These resolve fine for bundlers (the actual consumer: Angular apps) but trip
          # Node16 native ESM type resolution. We target bundler/ESM-import usage, so the
          # internal-resolution-error rule is intentionally ignored here.
          npx --yes @arethetypeswrong/cli --pack dist/libs/document-engine-core --profile esm-only --ignore-rules internal-resolution-error
          # angular is an ESM-only ng-packagr build (type: module, fesm2022). esm-only is the
          # right profile (CJS consumers use dynamic import, as expected). The "./styles" subpath
          # is a Sass-only entry (exports.sass, no JS/types), so it is excluded from type checks.
          npx --yes @arethetypeswrong/cli --pack dist/libs/document-engine-angular --profile esm-only --exclude-entrypoints ./styles

  # --- BLOCKING: angular peer-floor guard, layer 2 (real floor-Angular compile) ---
  # Pack the libs, install them into an isolated consumer pinned to the declared
  # Angular floor (>=16, see ADR-006) and AOT-build. Authoritative proof the package
  # is installable on the floor: it exercises the floor's template type-checker (the
  # .d.ts ɵɵComponentDeclaration input format) AND the partial-ivy linker on the
  # (Angular-20-built) declarations. A failure here blocks publish (publish.yml
  # `needs: security-gate`, which waits for every job in this workflow).
  ng-floor-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      # Functional install (allowed build scripts only — needed to build the libs).
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build libs + install on floor Angular + AOT build
        run: bash tools/ng-floor-compat/run.sh
