name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive appropriate SHAs for base and head
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # Lint affected projects (allow warnings, fail on errors only)
      # Exclude E2E project - it has its own job
      - name: Lint
        run: pnpm nx affected --target=lint --exclude=document-engine-e2e --parallel=3 -- --max-warnings=999
        continue-on-error: false

      # Test affected projects
      # Exclude E2E project - it has its own job
      - name: Test
        run: pnpm nx affected --target=test --exclude=document-engine-e2e --parallel=3 --coverage
        continue-on-error: false

      # Build affected projects
      - name: Build
        run: pnpm nx affected --target=build --parallel=3
        continue-on-error: false

      # Upload coverage reports (optional)
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage/**/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  # E2E Testing Job
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build App
        run: pnpm nx build document-engine

      - name: Install Serve Package
        run: npm install -g serve

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests (CI Suite)
        run: |
          # Khởi chạy server ở background (&) trỏ vào thư mục dist
          npx serve -s dist/apps/document-engine/browser -p 4200 &
          sleep 5
          pnpm exec playwright test --config=apps/document-engine-e2e/playwright.config.ts --project=ci
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4200

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/document-engine-e2e/playwright-report/
          retention-days: 7
