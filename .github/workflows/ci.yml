name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive appropriate SHAs for base and head
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Lint affected projects (allow warnings, fail on errors only)
      # Exclude E2E project - it has its own job
      - name: Lint
        run: pnpm nx affected --target=lint --exclude=document-engine-e2e --parallel=3 -- --max-warnings=999
        continue-on-error: false

      # Test affected projects
      # Exclude E2E project - it has its own job
      - name: Test
        run: pnpm nx affected --target=test --exclude=document-engine-e2e --parallel=3 --coverage
        continue-on-error: false

      # Build affected projects
      - name: Build
        run: pnpm nx affected --target=build --parallel=3
        continue-on-error: false

      # Upload coverage reports (optional)
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/**/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

      # Human-readable verdict on the run summary page (pass or fail) — no log-diving needed.
      - name: Result summary (pass)
        if: success()
        run: echo "✅ **validate** passed — lint + unit tests + build green on all affected projects." >> "$GITHUB_STEP_SUMMARY"
      - name: Result summary (fail)
        if: failure()
        run: echo "❌ **validate** failed — an affected project broke on lint, unit test, or build (see step logs above)." >> "$GITHUB_STEP_SUMMARY"

  # E2E Testing Job
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build App
        run: pnpm nx build document-engine

      - name: Install Serve Package
        run: npm install -g serve

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests (CI Suite)
        run: |
          # Khởi chạy server ở background (&) trỏ vào thư mục dist
          npx serve -s dist/apps/document-engine/browser -p 4200 &
          sleep 5
          pnpm exec playwright test --config=apps/document-engine-e2e/playwright.config.ts --project=ci
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4200

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/document-engine-e2e/playwright-report/
          retention-days: 7

      # Human-readable verdict on the run summary page (pass or fail) — no log-diving needed.
      - name: Result summary (pass)
        if: success()
        run: echo "✅ **e2e** passed — Playwright \`@ci\` suite green against the built app." >> "$GITHUB_STEP_SUMMARY"
      - name: Result summary (fail)
        if: failure()
        run: echo "❌ **e2e** failed — Playwright \`@ci\` suite red. Trace/report uploaded as the \`playwright-report\` artifact." >> "$GITHUB_STEP_SUMMARY"
