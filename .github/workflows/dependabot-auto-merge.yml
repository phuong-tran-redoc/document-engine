name: dependabot-triage

# Tiered Dependabot triage (DE-011). Decides per-PR whether a bump is safe to land
# automatically. It NEVER force-merges: it calls `gh pr merge --auto`, which only completes
# once every branch-protection required check (validate + e2e) is green. A bump that breaks
# the build/tests goes red → merge stays blocked → it falls back to manual review.
#
# Golden rule (strict): anything that ships inside a published package or is consumer-resolved
# (core's @tiptap/* + @floating-ui closure, angular runtime peers, lodash-es) is held for manual
# review on EVERY bump — patch included. A production patch (e.g. tiptap 3.10.5 -> 3.10.6) still
# edits the published contract, and CI cannot catch a runtime regression that still builds + tests
# green; that residual risk is a human's call. Only build/test tooling and CI plumbing auto-merge.
#
# Tier table:
#   AUTO  : dev-dependency (patch OR minor)  |  github-actions non-major
#   MANUAL: ANY production/peer dep (patch/minor/major)  |  framework-spine build tools
#           (nx, swc, ng-packagr — dev-typed but workspace-wide blast radius)  |  every major
# Playbook for the manual track: .context/ops/dependabot-auto-merge.md

on: pull_request

permissions:
  contents: write # enable auto-merge
  pull-requests: write # merge / label the PR
  issues: write # ensure the review label exists

jobs:
  # Job name = the check name shown on the PR. It is called "dependabot-triage" (NOT
  # "auto-merge") on purpose: a GREEN check here means "the bump was correctly triaged",
  # NOT "the PR was merged" and NOT "the bump is safe to merge". A manual-track bump still
  # produces a green check — the verdict (SAFE / NOT-SAFE per policy) is logged in the step
  # summary. Whether the PR can actually merge is decided by the required checks (validate + e2e).
  dependabot-triage:
    runs-on: ubuntu-latest
    # Only act on Dependabot's own PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Classify once (env-passed, no script injection) so the merge/label steps stay readable.
      # AUTO iff the bump is non-major AND it is either dev-tooling (direct:development) or a
      # github-actions bump — EXCEPT framework-spine build tools, which are forced to MANUAL.
      # Everything touching a production/peer dep — at any version level — falls through to MANUAL.
      # ecosystem string is the dependabot branch prefix, so github-actions => 'github_actions'.
      - name: Classify bump
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          # Framework-spine build tools (nx, swc, ng-packagr): dev-typed but workspace-wide blast
          # radius — they build the published .d.ts / fesm output — so hold them for manual review
          # even on a non-major bump, overriding the dev-tooling AUTO rule. dependency-names is a
          # comma/space-separated list; if any entry is a spine tool the whole (grouped) PR is manual.
          SPINE=$(printf '%s' "$DEP_NAMES" | tr ', ' '\n\n' | grep -E '^(nx|ng-packagr|@nx/.+|@swc/.+)$' || true)
          if [ -n "$SPINE" ]; then
            DECISION=manual
            REASON="framework-spine build tool ($(printf '%s' "$SPINE" | tr '\n' ' ')) — workspace-wide blast radius (builds the published .d.ts / fesm)"
          elif [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            DECISION=manual
            REASON="major bump — breaking by definition"
          elif [ "$DEP_TYPE" = "direct:development" ] || [ "$ECOSYSTEM" = "github_actions" ]; then
            DECISION=auto
            REASON="non-major dev-tooling / CI plumbing — never ships to consumers"
          else
            DECISION=manual
            REASON="production/peer dep — ships to or is resolved by consumers; CI cannot catch a runtime regression that still builds + tests green"
          fi
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

          if [ "$DECISION" = auto ]; then
            VERDICT="✅ SAFE per policy → auto-merge queued (lands ONLY after validate + e2e pass)"
          else
            VERDICT="⛔ NOT auto-safe per policy → held for manual review (verify per .context/ops/dependabot-auto-merge.md before merging)"
          fi

          # Emit the verdict to BOTH the job log and the PR check summary so it is unmissable.
          # A green check here just means "triaged correctly" — this block says SAFE vs NOT-SAFE.
          {
            echo "### Dependabot triage verdict"
            echo ""
            echo "- **Packages:** \`${DEP_NAMES}\`"
            echo "- **Update type:** ${UPDATE_TYPE}"
            echo "- **Dependency type:** ${DEP_TYPE}${ECOSYSTEM:+ / ${ECOSYSTEM}}"
            echo "- **Decision:** \`${DECISION}\`"
            echo "- **Reason:** ${REASON}"
            echo "- **Verdict:** ${VERDICT}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # AUTO: queue the PR. GitHub holds it until validate + e2e (branch protection) pass —
      # this never blind-merges. The SAFE/NOT-SAFE verdict is already logged by Classify above.
      - name: Enable auto-merge
        if: steps.classify.outputs.decision == 'auto'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # no checkout in this job; gh needs the repo explicitly
        run: |
          echo "Queuing auto-merge — GitHub will land this only once validate + e2e are green."
          gh pr merge --auto --squash "$PR_URL"

      # MANUAL: leave it for a human and label it so it is filterable. Does NOT merge.
      - name: Flag for manual review
        if: steps.classify.outputs.decision == 'manual'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # no checkout in this job; gh needs the repo explicitly
        run: |
          gh label create needs-manual-review \
            --color D93F0B \
            --description "Dependabot bump on a shipped dep or a minor/major — review per ops/dependabot-auto-merge.md" \
            --force
          gh pr edit "$PR_URL" --add-label needs-manual-review
          echo "Labeled needs-manual-review — held for a human (NOT merged)."
