name: Publish Packages

# Releases are tag-triggered. Cut a release locally with `nx release` (see /RELEASING.md):
#   pnpm nx release --skip-publish && git push --follow-tags
# Pushing a v* tag runs the security gate, then publishes both packages in lock-step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Must already exist as the source-of-truth.'
        required: true
      dry_run:
        description: 'Run the full toolchain but stop at npm publish --dry-run (no real publish, skips the approval gate)'
        type: boolean
        default: false

jobs:
  # Required pre-publish gate (secrets / vulns / licenses / tarball / type correctness).
  security-gate:
    uses: ./.github/workflows/security-gate.yml
    secrets: inherit

  publish:
    needs: security-gate
    runs-on: ubuntu-latest
    # Real publishes require manual approval via the `npm-publish` environment's required reviewers.
    # Dry-runs evaluate to an empty environment (no gate) so the pipeline can be iterated freely.
    # NB: the truthy branch must be 'npm-publish' — an empty string is falsy in GitHub expressions,
    # so `dry_run && '' || 'npm-publish'` would wrongly always gate. Invert the condition instead.
    environment: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && 'npm-publish' || '' }}
    # Permissions required for OIDC Trusted Publishing.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # pnpm 11.x requires Node >= 22.13 (uses the node:sqlite builtin).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json (pnpm 11.x).
        # pnpm 9 cannot do OIDC Trusted Publishing; pnpm 11 needs Node >= 22.13 (set above).
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Derive the version from the tag (push) or the manual input (workflow_dispatch),
      # stamp it + the resolved dependency range into the built dist manifests, then publish.
      # `nx release version <v>` runs preVersionCommand (build) before stamping.
      - name: Build + version + publish (OIDC trusted publishing + provenance)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Publishing version: $VERSION"
          # Stamp the tagged version + resolved dep ranges into the built dist manifests.
          pnpm nx release version "$VERSION" --git-commit=false --git-tag=false --stage-changes=false
          # Publish each built package with npm (>= 11.5.1) for OIDC Trusted Publishing + provenance.
          # nx's pnpm-based `release publish` does NOT perform OIDC (it expects an npm token and fails
          # token-lessly with an empty "pnpm publish error:"); npm does OIDC natively. Core first —
          # angular depends on it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — validating the toolchain + tarball without publishing"
            npm publish ./dist/libs/document-engine-core --access public --dry-run
            npm publish ./dist/libs/document-engine-angular --access public --dry-run
          else
            npm publish ./dist/libs/document-engine-core --provenance --access public
            npm publish ./dist/libs/document-engine-angular --provenance --access public
          fi
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Verify published signatures (advisory)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        run: npm audit signatures
