name: Publish Packages

# Releases are tag-triggered. Cut a release locally with `nx release` (see /RELEASING.md):
#   pnpm nx release --skip-publish && git push --follow-tags
# Pushing a v* tag runs the security gate, then publishes both packages in lock-step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Must already exist as the source-of-truth.'
        required: true

jobs:
  # Required pre-publish gate (secrets / vulns / licenses / tarball / type correctness).
  security-gate:
    uses: ./.github/workflows/security-gate.yml
    secrets: inherit

  publish:
    needs: security-gate
    runs-on: ubuntu-latest
    # Permissions required for OIDC Trusted Publishing.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          # Must match the repo's pnpm (11.x) — pnpm 9 cannot do OIDC Trusted Publishing
          # (publishes token-lessly), and predates the `allowBuilds` lockfile metadata.
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Derive the version from the tag (push) or the manual input (workflow_dispatch),
      # stamp it + the resolved dependency range into the built dist manifests, then publish.
      # `nx release version <v>` runs preVersionCommand (build) before stamping.
      - name: Build + version + publish (OIDC trusted publishing + provenance)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Publishing version: $VERSION"
          pnpm nx release version "$VERSION" --git-commit=false --git-tag=false --stage-changes=false
          pnpm nx release publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Verify published signatures (advisory)
        continue-on-error: true
        run: npm audit signatures
