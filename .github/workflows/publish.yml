name: Publish Packages

# Releases are tag-triggered. Cut a release locally with `nx release` (see /RELEASING.md):
#   pnpm nx release --skip-publish && git push --follow-tags
# Pushing a v* tag runs the security gate, then publishes both packages in lock-step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Must already exist as the source-of-truth.'
        required: true
      dry_run:
        description: 'Run the full toolchain but stop at npm publish --dry-run (no real publish, skips the approval gate)'
        type: boolean
        default: false

jobs:
  # Required pre-publish gate (secrets / vulns / licenses / tarball / type correctness).
  security-gate:
    uses: ./.github/workflows/security-gate.yml
    secrets: inherit

  publish:
    needs: security-gate
    runs-on: ubuntu-latest
    # Real publishes require manual approval via the `npm-publish` environment's required reviewers.
    # Dry-runs evaluate to an empty environment (no gate) so the pipeline can be iterated freely.
    # NB: the truthy branch must be 'npm-publish' — an empty string is falsy in GitHub expressions,
    # so `dry_run && '' || 'npm-publish'` would wrongly always gate. Invert the condition instead.
    environment: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && 'npm-publish' || '' }}
    # Permissions: id-token for OIDC Trusted Publishing; contents:write to create the GitHub Release.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # pnpm 11.x requires Node >= 22.13 (uses the node:sqlite builtin).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Setup pnpm
        # pnpm version is read from the "packageManager" field in package.json (pnpm 11.x).
        # pnpm 9 cannot do OIDC Trusted Publishing; pnpm 11 needs Node >= 22.13 (set above).
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Derive the version from the tag (push) or the manual input (workflow_dispatch),
      # stamp it + the resolved dependency range into the built dist manifests, then publish.
      # `nx release version <v>` runs preVersionCommand (build) before stamping.
      - name: Build + version + publish (OIDC trusted publishing + provenance)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Publishing version: $VERSION"
          # Stamp the tagged version + resolved dep ranges into the built dist manifests.
          pnpm nx release version "$VERSION" --git-commit=false --git-tag=false --stage-changes=false
          # Generate THIRD-PARTY-NOTICES.txt into each dist before publishing (shipped via the `files` allowlist).
          node tools/security/generate-third-party-notices.mjs ./dist/libs/document-engine-core
          node tools/security/generate-third-party-notices.mjs ./dist/libs/document-engine-angular
          # Publish each built package with npm (>= 11.5.1) for OIDC Trusted Publishing + provenance.
          # nx's pnpm-based `release publish` does NOT perform OIDC (it expects an npm token and fails
          # token-lessly with an empty "pnpm publish error:"); npm does OIDC natively. Core first —
          # angular depends on it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — validating the toolchain + tarball without publishing"
            npm publish ./dist/libs/document-engine-core --access public --dry-run
            npm publish ./dist/libs/document-engine-angular --access public --dry-run
          else
            npm publish ./dist/libs/document-engine-core --provenance --access public
            npm publish ./dist/libs/document-engine-angular --provenance --access public
          fi
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Verify published signatures (advisory)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        run: npm audit signatures

      # Create the GitHub Release for the tag from CI. We do this here (not in local
      # `nx release`) because the local git `origin` is an SSH host alias that nx's
      # GitHub-API resolver can't parse, so `changelog.workspaceChangelog.createRelease`
      # is false in nx.json. Real tag-pushes only (skip workflow_dispatch / dry-run).
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract this version's section from CHANGELOG.md (nx heading: "## <version> (date)").
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |\\()" {flag=1; print; next}
            /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
